{{- if .Values.playground.enabled }}
---
kind: OGXServer
apiVersion: ogx.io/v1beta1
metadata:
  name: {{ .Values.playground.name }}
  namespace: {{ .Values.global.tenant.namespacePrefix }}-{{ .Values.global.tenant.username }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: {{ .Values.playground.name }}
spec:
  distribution:
    name: rh
  network:
    port: 8321
    policy:
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: {{ .Release.Namespace }}
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: {{ .Values.global.tenant.namespacePrefix }}-{{ .Values.global.tenant.username }}
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: redhat-ods-applications
          ports:
            - protocol: TCP
              port: 8321
  overrideConfig:
    key: config.yaml
    name: llama-stack-config
  workload:
    replicas: 1
    resources:
      limits:
        cpu: "2"
        memory: 12Gi
      requests:
        cpu: 250m
        memory: 500Mi
    overrides:
      command:
        - /bin/sh
        - -c
        - ogx run /etc/ogx/config.yaml --insecure
      volumes:
        - name: maas-ca
          secret:
            secretName: maas-api-key
            items:
              - key: ca.crt
                path: ca.crt
      volumeMounts:
        - name: maas-ca
          mountPath: /etc/maas
          readOnly: true
      env:
        - name: SSL_CERT_FILE
          value: /etc/maas/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /etc/maas/ca.crt
        - name: VLLM_TLS_VERIFY
          value: "true"
        - name: FAISS_STORE_DIR
          value: ~/.llama/faiss
        - name: SENTENCE_TRANSFORMERS_HOME
          value: /opt/app-root/.cache/huggingface/hub
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: HF_DATASETS_OFFLINE
          value: "1"
        - name: VLLM_MAX_TOKENS_1
          value: {{ .Values.playground.maxTokens | quote }}
        - name: VLLM_API_TOKEN_1
          valueFrom:
            secretKeyRef:
              name: maas-api-key
              key: api-key
        - name: PGVECTOR_HOST
          value: genai-pgvector.{{ .Values.global.tenant.namespacePrefix }}-{{ .Values.global.tenant.username }}.svc.cluster.local
        - name: PGVECTOR_PORT
          value: "5432"
        - name: PGVECTOR_DB
          value: vectordb
        - name: PGVECTOR_USER
          value: vectoruser
        - name: PGVECTOR_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: genai-pgvector-credentials
        - name: OGX_CONFIG_DIR
          value: /opt/app-root/src/.ogx/distributions/rh/
{{- end }}
